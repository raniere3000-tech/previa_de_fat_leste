name: Avisar alterações do painel original

# Verifica se o painel original (analise-faturamento-agua-esgoto) recebeu commits
# que ainda não foram replicados aqui. Mantém uma única issue aberta com a lista;
# fecha a issue quando tudo estiver replicado. Não altera nenhum arquivo.

on:
  schedule:
    - cron: '41 */2 * * *'   # a cada 2 horas
  push:
    branches: [main]
    paths: ['.github/replicacao-original.txt']
  workflow_dispatch:

concurrency:
  group: avisar-replicacao
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comparar com o painel original
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL: raniere3000-tech/analise-faturamento-agua-esgoto
          ROTULO: replicar-original
        run: |
          set -eu
          BASE=$(grep -m1 -oE '^[0-9a-f]{7,40}' .github/replicacao-original.txt)
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$ORIGINAL.git" original
          cd original

          if ! git merge-base --is-ancestor "$BASE" origin/main; then
            echo "::error::O commit $BASE de .github/replicacao-original.txt não está na main do original."
            exit 1
          fi

          LISTA=$(git log --no-merges --reverse --format="- [ ] [\`%h\`](https://github.com/$ORIGINAL/commit/%H) %s" "$BASE..origin/main")
          QTD=$(git rev-list --no-merges --count "$BASE..origin/main")
          cd ..

          ISSUE=$(gh issue list --label "$ROTULO" --state open --json number --jq '.[0].number // empty')

          if [ "$QTD" -eq 0 ]; then
            echo "✔ Tudo replicado (até $BASE)."
            if [ -n "$ISSUE" ]; then
              gh issue close "$ISSUE" --comment "Tudo replicado até \`${BASE:0:7}\`. Fechando automaticamente."
            fi
            exit 0
          fi

          TITULO="Replicar $QTD alteração(ões) do painel original"
          {
            echo "O painel original ([$ORIGINAL](https://github.com/$ORIGINAL)) tem **$QTD** commit(s) ainda não replicado(s) aqui:"
            echo
            echo "$LISTA"
            echo
            echo "Último replicado: \`${BASE:0:7}\` (arquivo \`.github/replicacao-original.txt\`)."
            echo
            echo "**Depois de replicar**, troque a primeira linha de \`.github/replicacao-original.txt\` pelo hash completo do último commit replicado. Esta issue se atualiza ou fecha sozinha."
          } > corpo.md

          if [ -n "$ISSUE" ]; then
            echo "↻ Atualizando issue #$ISSUE ($QTD pendentes)"
            gh issue edit "$ISSUE" --title "$TITULO" --body-file corpo.md
          else
            echo "＋ Abrindo issue ($QTD pendentes)"
            gh label create "$ROTULO" --color FBCA04 --description "Alterações do painel original a replicar" --force
            gh issue create --title "$TITULO" --body-file corpo.md --label "$ROTULO"
          fi
